# Render blueprint — VehicleMatch backend (Django) on the free tier.
# Free Web Service: 512MB RAM, sleeps after 15 min, cold start ~30-50s.
# SQLite lives in the baked image; user-generated demo data resets at restart.

services:
  - type: web
    name: vehicle-match-api
    runtime: python
    plan: free
    rootDir: backend
    region: oregon
    autoDeploy: true

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt -r render-requirements.txt
      DJANGO_SECRET_KEY=build-only-key \
      DJANGO_ALLOWED_HOSTS=build.localhost \
        python manage.py collectstatic --noinput --settings=freedom_ford.prod_settings
      DJANGO_SECRET_KEY=build-only-key \
      DJANGO_ALLOWED_HOSTS=build.localhost \
        python manage.py migrate --settings=freedom_ford.prod_settings

    startCommand: |
      gunicorn freedom_ford.wsgi:application \
        --bind 0.0.0.0:$PORT \
        --workers 2 \
        --timeout 60 \
        --access-logfile - \
        --error-logfile -

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DJANGO_SETTINGS_MODULE
        value: freedom_ford.prod_settings
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Add the frontend Vercel URL to CORS once the SPA is deployed.
      # Update this list whenever a new frontend host needs API access.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://vehicle-match.vercel.app,https://24-7-ai-global.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://vehicle-match.vercel.app,https://24-7-ai-global.vercel.app"
      # Default LLM provider stays Ollama (unavailable on Render free) — chat
      # gracefully falls back to a clear "trouble reaching AI" message. Other
      # features (inventory, payment calc, dashboard) keep working.
      # To enable real chat, set DEALER_AI_LLM_PROVIDER=openai and add
      # OPENAI_API_KEY in the Render dashboard.
      - key: DEALER_AI_LLM_PROVIDER
        value: ollama
