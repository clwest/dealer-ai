<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 72" role="img" aria-label="Copper Canyon Auto">
  <title>Copper Canyon Auto</title>
  <!--
    Placeholder logo for the invented independent-dealer persona
    Copper Canyon Auto (Yuma, AZ). Ships with the SESSION_030
    pivot. Real dealers replace this asset with their own
    branding per docs/DEALER_DUPLICATION_GUIDE.md and
    frontend/src/config/defaultDealer.ts.
  -->
  <defs>
    <linearGradient id="canyon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8a3c1f"/>
      <stop offset="1" stop-color="#c76b3a"/>
    </linearGradient>
  </defs>

  <!-- Canyon silhouette mark -->
  <g transform="translate(6 8)">
    <!-- Sun -->
    <circle cx="26" cy="20" r="10" fill="#e9b25c"/>
    <!-- Foreground canyon layer -->
    <path d="M0 56 L0 40 L14 28 L24 34 L36 22 L48 30 L56 26 L56 56 Z"
          fill="url(#canyon)"/>
    <!-- Background ridge -->
    <path d="M0 56 L0 46 L10 38 L20 42 L32 34 L44 40 L56 34 L56 56 Z"
          fill="#3f6b90" opacity="0.55"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#0a0e14">
    <text x="72" y="34" font-size="20" font-weight="700" letter-spacing="0.5">
      COPPER CANYON
    </text>
    <text x="72" y="54" font-size="11" font-weight="500" letter-spacing="2" fill="#3b4453">
      AUTO · YUMA, AZ
    </text>
  </g>
</svg>
