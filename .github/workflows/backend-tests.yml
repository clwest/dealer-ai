# Backend + frontend unit-test gate.
#
# Runs on every pull_request and push to main. Complements the
# Playwright acceptance job (acceptance.yml) which validates
# end-to-end operational workflows. This job pins:
#   - Django tests (state machines, permissions, service logic,
#     compliance scrubs, payment math, GL invariants)
#   - Vitest tests (React component behavior, API client typing)
#   - TypeScript strict-mode compilation
#   - Django `check` (settings + model wiring)
#   - Django `makemigrations --check --dry-run` (no undeclared
#     schema drift)

name: unit-tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django check
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-key
          DJANGO_ALLOWED_HOSTS: localhost
        run: python manage.py check

      - name: Migrations drift check
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-key
          DJANGO_ALLOWED_HOSTS: localhost
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-key
          DJANGO_ALLOWED_HOSTS: localhost
        run: python manage.py test dealer_ai --verbosity=1

  frontend:
    name: Frontend (Vitest + tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript strict compile
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Vitest
        working-directory: frontend
        run: npm run test
